[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-fence"
version = "0.1.0"
description = "Prove what GitHub Actions can upload before CI publishes it."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Artifact Fence contributors"}]
keywords = ["github-actions", "ci", "artifacts", "security", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
artifact-fence = "artifact_fence.cli:main"

[project.urls]
Homepage = "https://github.com/pangxueyuan2-creator/artifact-fence"
Repository = "https://github.com/pangxueyuan2-creator/artifact-fence"
Issues = "https://github.com/pangxueyuan2-creator/artifact-fence/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["artifact_fence"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.coverage.paths]
source = ["src/artifact_fence"]
