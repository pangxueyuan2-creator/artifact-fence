name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo "tests passed" > build/results.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          include-hidden-files: true
          path: build/**
